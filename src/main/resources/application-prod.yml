# application-prod.yml - FOR RENDER + NEON.DB DEPLOYMENT
spring:
  config:
    activate:
      on-profile: prod

  application:
    name: mgnrega-dashboard

  datasource:
    url: ${DATABASE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate  # Tables are already created, just validate schema
    show-sql: false  # Disabled in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  cache:
    type: simple
    cache-names: states, districts, performance

  # Disable static resources (frontend is separate on Netlify)
  web:
    resources:
      add-mappings: false

# MGNREGA API Configuration
mgnrega:
  api:
    base-url: https://api.data.gov.in/resource
    resource-id: "ee03643a-ee4c-48c2-ac30-9f2ff26ab722"
    api-key: ${MGNREGA_API_KEY}
    retry:
      max-attempts: 3
      delay: 2000

# Scheduler Configuration
scheduler:
  data-refresh:
    cron: "0 0 2 * * ?"

# Server Configuration
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# Logging - Production level
logging:
  level:
    root: INFO
    com.mgnrega.dashboard: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# App Configuration
app:
  name: ${APP_NAME:MGNREGA-Dashboard}
  contact:
    email: ${APP_CONTACT_EMAIL:thanseerjelani@gmail.com}

# Management endpoints (optional but recommended)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized